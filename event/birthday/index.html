<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B4BC8">
<title>행운의 뽑기판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{
    background:#2B4BC8;
    font-family:'Noto Sans KR',sans-serif;color:#1C2B63;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  button{font-family:inherit}
  .bhs{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}

  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) translateX(-2px)}40%{transform:rotate(6deg) translateX(2px)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  @keyframes bounceIn{0%{transform:scale(.3) translateY(20px);opacity:0}55%{transform:scale(1.12) translateY(-6px);opacity:1}75%{transform:scale(.96)}100%{transform:scale(1) translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes burst{0%{translate:0 0;opacity:0;scale:.3}30%{opacity:1}100%{translate:0 -110px;opacity:0;scale:1}}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}

  .page{
    max-width:430px;margin:0 auto;min-height:100vh;
    padding:16px 14px 32px;box-sizing:border-box;
    display:flex;flex-direction:column;gap:14px;
    position:relative;overflow-x:hidden;
  }

  /* ---------- Board: navy panel with thick cream frame ---------- */
  .panel{
    background:#1C2B63;border:7px solid #F4E9CF;border-radius:10px;
    padding:14px 12px 14px;
    box-shadow:0 10px 30px rgba(10,20,60,.35), inset 0 0 0 2px #2B4BC8;
    display:flex;flex-direction:column;gap:14px;
  }
  .panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 0}
  .head-title{
    flex:1;min-width:0;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .t-word{
    display:inline-block;font-size:clamp(26px,9vw,40px);line-height:1;color:#F6C531;
    -webkit-text-stroke:1.5px #1C2B63;
    text-shadow:3px 3px 0 #F2668B, 4px 4px 0 #1C2B63;
    letter-spacing:-1px;white-space:nowrap;
  }
  .patrick-float{flex:none;width:clamp(52px,15vw,70px);display:block}
  .patrick{width:100%;display:block;filter:drop-shadow(2px 3px 0 rgba(10,20,60,.35))}
  .pills{display:flex;flex-direction:column;gap:3px;align-items:stretch;flex:none}
  .pill-row{display:flex;gap:3px}
  .pill{
    flex:1;display:flex;align-items:center;justify-content:flex-start;gap:3px;background:#FFFDF6;border-radius:99px;
    padding:2px 5px 2px 2px;font-size:9.5px;font-weight:700;color:#1C2B63;
    box-shadow:0 2px 0 #C9961A;white-space:nowrap;
  }
  .pill .chip{border-radius:99px;padding:2px 4px;font-size:9.5px}
  .pill .chip + span{flex:1;text-align:center}
  .divider{border-top:2px dashed rgba(244,233,207,.35)}

  /* ---------- DrawBoard ---------- */
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .cell{
    height:46px;border-radius:0 0 6px 6px;border:none;border-bottom:3px solid #C9961A;
    background:#F6C531;box-shadow:0 3px 6px rgba(0,0,0,.25);color:#1C2B63;
    font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:18px;font-weight:400;
    cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease,box-shadow .15s ease,opacity .3s;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  @media(hover:hover){.cell:not(.done):hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,.3)}}
  .cell:not(.done):active{transform:scale(.93)}
  .cell.done{box-shadow:none;cursor:default}
  .cell.nudge{animation:shake .45s ease-in-out}
  .cell.flash{animation:flashcell 1.1s ease 2}
  @keyframes flashcell{0%,100%{box-shadow:0 0 0 0 rgba(246,197,49,0)}50%{box-shadow:0 0 0 6px rgba(246,197,49,.85)}}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:80;
    background:#FFFDF6;border:3px solid #1C2B63;border-radius:99px;
    padding:10px 18px;font-size:13.5px;font-weight:700;color:#1C2B63;
    box-shadow:0 4px 0 #1C2B63;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* ---------- BirthdayMessage ---------- */
  .letter{
    text-align:center;padding:18px 16px 16px;border:4px solid #1C2B63;border-radius:10px;
    background:#FFFDF6;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #1C2B63;
  }
  .letter .top{margin:0;font-size:22px;color:#F2668B;line-height:1.25}
  .letter .body{margin:0;font-size:14px;line-height:1.7;color:#1C2B63;white-space:pre-line}
  .letter .end{margin:4px 0 0;font-size:20px;color:#2B4BC8}

  /* ---------- ResultReveal ---------- */
  #ovbg{
    position:fixed;inset:0;z-index:50;background:rgba(12,22,70,.6);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    animation:fadeIn .3s ease;transition:opacity .4s;
  }
  #card{
    position:fixed;z-index:55;perspective:1000px;
    transition:opacity .3s, transform .6s cubic-bezier(.2,.8,.2,1);
  }
  #card.shake{animation:shake .5s ease-in-out}
  #card.noanim{transition:none}
  #cardBottom{
    position:absolute;inset:0;box-sizing:border-box;background:#FBF3DC;
    border:2px solid #E7D7AE;display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 30px rgba(0,0,0,.3);
  }
  #resWrap{display:flex;flex-direction:column;align-items:center;gap:7px}
  #resText{font-size:52px;line-height:1;animation:bounceIn .7s cubic-bezier(.2,.8,.2,1) both}
  #resReward{font-size:14px;font-weight:700;animation:bounceIn .7s cubic-bezier(.2,.8,.2,1) .12s both}
  #flap{
    position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;
    transform-origin:top center;transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.3,.7,.25,1);
  }
  #card.noanim #flap{transition:none}
  .flap-front{
    position:absolute;inset:0;background:#F6C531;border-bottom:4px solid #C9961A;
    box-sizing:border-box;backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .flap-front span{font-size:30px;color:#1C2B63;display:inline-block}
  .flap-front span.beating{animation:beat .55s ease-in-out infinite}
  .flap-back{
    position:absolute;inset:0;background:#FBF3DC;border:2px solid #E7D7AE;
    border-bottom:2px dashed #C9B98A;box-sizing:border-box;backface-visibility:hidden;
    transform:rotateX(180deg);border-radius:14px 14px 0 0;
    box-shadow:0 -6px 20px rgba(0,0,0,.15);
  }
  #particles{position:absolute;left:0;top:-160px;width:100%;height:320px;pointer-events:none;z-index:3}
  #particles .arm{position:absolute;left:50%;top:50%;pointer-events:none}
  #particles .arm span{display:inline-block;animation:burst ease-out both}
  .confetti-piece{position:fixed;z-index:60;top:-20px;pointer-events:none;border-radius:2px;animation:confettiFall linear forwards}

  /* ---------- 1등 소원권 전용 연출 ---------- */
  #ovbg.deep{background:rgba(6,12,46,.85)}
  #rays{
    position:fixed;left:50%;top:calc(50% - 24px);width:660px;height:660px;
    z-index:52;pointer-events:none;opacity:0;transition:opacity .6s;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(rgba(246,197,49,.32) 0 11deg, rgba(246,197,49,0) 11deg 26deg);
    -webkit-mask:radial-gradient(closest-side,#000 18%,transparent 72%);
    mask:radial-gradient(closest-side,#000 18%,transparent 72%);
  }
  #rays.on{opacity:1;animation:raysSpin 16s linear infinite}
  @keyframes raysSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  #flash{
    position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 45%, #FFFDF6 0%, #FBEBAF 35%, rgba(246,197,49,0) 75%);
  }
  #flash.pop{animation:flashPop .6s ease-out both}
  @keyframes flashPop{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
  #card.gold .flap-front{animation:goldPulse 1s ease-in-out infinite}
  #card.gold.charge .flap-front{animation-duration:.4s}
  @keyframes goldPulse{
    0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.35), 0 0 16px 2px rgba(246,197,49,.45)}
    50%{box-shadow:0 10px 26px rgba(0,0,0,.35), 0 0 44px 13px rgba(246,197,49,.9)}
  }
  #card.gold .flap-back{background:#FDEBB0;border-color:#E7C97A}
  #card.gold #cardBottom{border-color:#E7C97A}
  #card.charge{animation:chargeTremble .12s linear infinite}
  @keyframes chargeTremble{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}50%{transform:translate(1.5px,-1px)}75%{transform:translate(-1px,-1.5px)}}
  #card.bam{animation:bam .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes bam{0%{transform:scale(1.07)}30%{transform:translate(-5px,3px)}55%{transform:translate(5px,-3px)}78%{transform:translate(-3px,2px)}100%{transform:none}}
  .flap-front span.beating.fast{animation-duration:.3s}
  @keyframes suckIn{0%{translate:0 -150px;opacity:0;scale:.4}35%{opacity:1}85%{opacity:1}100%{translate:0 -4px;opacity:0;scale:1}}
  @keyframes shineSweep{from{background-position:200% 0}to{background-position:-100% 0}}
  #resText.gold-shine{
    font-size:44px;color:transparent;
    background:linear-gradient(115deg,#C9961A 20%,#F6C531 36%,#FFF6D8 50%,#F6C531 64%,#C9961A 80%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(201,150,26,.35));
    animation:bounceIn .7s cubic-bezier(.2,.8,.2,1) both, shineSweep 1.5s linear .4s infinite;
  }
  #wishTicket{
    position:relative;margin-top:2px;text-align:center;
    background:#FFFDF6;border:2px dashed #C9961A;border-radius:8px;
    padding:9px 16px;box-shadow:0 3px 0 rgba(201,150,26,.45);
    font-size:14.5px;font-weight:700;color:#E5432C;line-height:1.4;max-width:200px;
    animation:bounceIn .7s cubic-bezier(.2,.8,.2,1) .15s both;
  }
  #wishTicket .wt-cut{position:absolute;top:-10px;left:12px;font-size:12px;line-height:1;background:#FDEBB0;padding:0 3px}

  /* ---------- CompletionModal ---------- */
  #done{
    position:fixed;inset:0;z-index:70;background:rgba(12,22,70,.6);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:fadeIn .4s ease;
  }
  #done[hidden],#reveal[hidden]{display:none}
  .done-card{
    background:#FFFDF6;border-radius:12px;padding:26px 22px 22px;
    width:100%;max-width:330px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    box-shadow:0 8px 0 #1C2B63, 0 24px 50px rgba(0,0,0,.35);border:4px solid #1C2B63;
    animation:bounceIn .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .done-card .big-emoji{font-size:44px;line-height:1}
  .done-card h2{margin:0;font-size:28px;color:#1C2B63;line-height:1.2}
  .done-card .sub{margin:0;font-size:13.5px;color:#5B6690}
  .d-grid{margin-top:8px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px}
  .d-grid div{border-radius:8px;padding:10px;font-weight:700}
  .d-grid .full{grid-column:1/-1}
  .d-grid .n{font-size:18px;font-weight:400}
  .done-card .end{margin:10px 0 0;font-size:20px;color:#F2668B}
  .done-card button{
    margin-top:6px;min-height:44px;padding:0 22px;border-radius:99px;border:none;
    background:#1C2B63;color:#F6C531;font-weight:700;font-size:14px;cursor:pointer;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Board: header + grid -->
  <section class="panel">
    <header>
      <span class="patrick-float"><img class="patrick" src="patrick.png?v=3" alt="뚱이"></span>
      <h1 class="head-title" id="title" style="margin:0">
        <span class="t-word bhs">행운의</span>
        <span class="t-word bhs">뽑기판</span>
      </h1>
      <div class="pills" id="pills"></div>
    </header>
    <div class="divider"></div>
    <div class="grid" id="grid"></div>
  </section>

</div>

<!-- ResultReveal -->
<div id="reveal" hidden>
  <div id="ovbg"></div>
  <div id="rays"></div>
  <div id="confetti"></div>
  <div id="card">
    <div id="cardBottom"><div id="resWrap" hidden><span id="resText" class="bhs"></span><div id="wishTicket" hidden><span class="wt-cut">✂️</span><span id="wtSub"></span></div><span id="resReward"></span></div></div>
    <div id="flap">
      <div class="flap-front"><span id="coverIcon">♥</span></div>
      <div class="flap-back"></div>
    </div>
    <div id="particles"></div>
  </div>
  <div id="flash"></div>
</div>

<div id="toast"></div>

<!-- CompletionModal -->
<div id="done" hidden>
  <div class="done-card">
    <span class="big-emoji">🎉</span>
    <h2 class="bhs">모든 뽑기를 완료했어요!</h2>
    <p class="sub">오늘의 행운을 모두 확인했어요 💕</p>
    <div class="d-grid" id="dGrid"></div>
    <p class="end bhs" id="doneEnd"></p>
    <button id="doneBtn">뽑기판 보기</button>
  </div>
</div>

<script>
'use strict';
const REVEAL_SPEED = '보통';       // '느리게' | '보통' | '빠르게'

const TOKENS = JSON.parse(atob(PACKED));

let revealed, usedTokens;
let pending = null;                         // 스캔했지만 아직 안 뜯은 QR: { token, rank }
let usedEntry = null;                       // 이미 사용한 QR로 들어온 경우: 그때 연 칸번호
(function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  revealed = (saved && Array.isArray(saved.revealedCards)) ? saved.revealedCards : [];   // [칸번호, 등수] 쌍
  usedTokens = (saved && saved.usedTokens && typeof saved.usedTokens === 'object') ? saved.usedTokens : {};  // 토큰 → 칸번호
})();
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      revealedCards: revealed, usedTokens: usedTokens, remainingCount: 60 - revealed.length
    }));
  } catch (e) {}
}
const openedRank = id => {
  const hit = revealed.find(p => p[0] === id);
  return hit ? hit[1] : null;
};

/* ---------- Header: prize pills (1등 / 2등 3등 / 4등 5등 세 줄) ---------- */
[['first'], ['second', 'third'], ['fourth', 'fifth']].forEach(keys => {
  const row = document.createElement('div');
  row.className = 'pill-row';
  keys.forEach(key => {
    const r = RANKS[key];
    const el = document.createElement('div');
    el.className = 'pill';
    el.innerHTML = '<span class="chip bhs" style="background:' + r.chipBg + ';color:' + r.chipColor + '">' + r.label + '</span>'
      + '<span>' + r.short + '</span>';
    row.appendChild(el);
  });
  $('pills').appendChild(row);
});

/* ---------- DrawBoard: QR을 찍은 상태에서만 칸을 골라 뜯을 수 있다 ---------- */
const cells = [];
for (let i = 1; i <= 60; i++) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'cell';
  b.textContent = CELL_ICON;
  b.addEventListener('click', () => {
    if (b.classList.contains('done')) {
      const R = RANKS[openedRank(i)];
      toast('이미 뽑은 티켓 — ' + R.label);
      return;
    }
    if (pending) { runReveal(i); return; }
    b.classList.remove('nudge');
    void b.offsetWidth;
    b.classList.add('nudge');
    if (usedEntry) {                         // 사용한 QR로 들어온 상태: 새 뽑기가 아니다
      const R = RANKS[openedRank(usedEntry)];
      highlight(usedEntry);
      toast('이미 뽑은 티켓 — ' + R.label);
    } else {
      toast('부적절한 접근! 📱');
    }
  });
  $('grid').appendChild(b);
  cells.push(b);
}
function paintCell(id) {
  const b = cells[id - 1], R = RANKS[openedRank(id)];
  b.classList.add('done');
  b.textContent = R.label;
  b.style.fontSize = '15px';
  b.style.background = R.cellBg;
  b.style.borderBottomColor = R.cellBorder;
  b.style.color = R.cellColor;
}
revealed.forEach(p => paintCell(p[0]));

/* ---------- ResultReveal: 칸에서 날아와 반으로 접힌 종이가 펼쳐진다 ---------- */
let active = null;           // { id, rank, phase, rect }
let timers = [];
const after = (ms, fn) => timers.push(setTimeout(fn, ms));
const k = SPEED[REVEAL_SPEED] || 1;

function layout(compact) {
  const card = $('card'), r = active.rect;
  const cx = (innerWidth - CARD_W) / 2;
  const paperTop = (innerHeight - PAPER_H) / 2 - 24;
  if (compact) {
    card.style.left = r.left + 'px'; card.style.top = r.top + 'px';
    card.style.width = r.width + 'px'; card.style.height = r.height + 'px';
    card.style.transform = 'none';
  } else {
    /* 상자를 최종 크기로 두고 transform으로 칸 위치·크기에서 출발시켜,
       테두리와 모서리까지 비율 그대로 확대되게 한다 */
    const top = paperTop + PACKET_H;
    card.classList.add('noanim');
    card.style.left = cx + 'px'; card.style.top = top + 'px';
    card.style.width = CARD_W + 'px'; card.style.height = PACKET_H + 'px';
    card.style.transformOrigin = '0 0';
    card.style.transform = 'translate(' + (r.left - cx) + 'px,' + (r.top - top) + 'px) '
      + 'scale(' + (r.width / CARD_W) + ',' + (r.height / PACKET_H) + ')';
    void card.offsetWidth;
    card.classList.remove('noanim');
    card.style.transform = 'none';
  }
  /* 노란 덮개는 확대 비율에 맞춰 라운드와 테두리를 키워, 칸이 그대로 커진 것처럼 보이게 한다.
     덮개가 닫혀 있는 동안 아래장은 덮개와 같은 라운드로 숨겨 삐져나오지 않게 하고,
     펼쳐지는 시점(open 단계)에 14px 라운드와 2px 겹침으로 바꾼다 */
  const ff = document.querySelector('.flap-front');
  if (compact) {
    ff.style.borderRadius = '0 0 6px 6px';
    ff.style.borderBottomWidth = '3px';
    $('cardBottom').style.borderRadius = '0 0 6px 6px';
  } else {
    const R = Math.round(6 * CARD_W / r.width);
    ff.style.borderRadius = '0 0 ' + R + 'px ' + R + 'px';
    ff.style.borderBottomWidth = Math.round(3 * (PACKET_H / r.height)) + 'px';
    $('cardBottom').style.borderRadius = '0 0 ' + R + 'px ' + R + 'px';
  }
  $('cardBottom').style.top = '0';
}

function runReveal(id) {
  if (active || !pending || openedRank(id)) return;
  const rect = cells[id - 1].getBoundingClientRect();
  const rank = pending.rank;
  active = { id, rank, phase: 'shake', rect };

  /* 칸을 고른 순간 즉시 확정 저장: 연출을 끝까지 안 봐도 다시 뽑을 수 없다 */
  revealed.push([id, rank]);
  usedTokens[pending.token] = id;
  pending = null;
  usedEntry = id;              // 이 세션의 티켓은 사용 완료: 이후 탭에는 "이미 뽑은 티켓" 안내
  history.replaceState(null, '', location.pathname);
  save();

  const card = $('card'), cover = $('coverIcon');
  $('reveal').hidden = false;
  $('ovbg').style.opacity = 1;
  card.style.opacity = 1;
  cover.textContent = CELL_ICON;
  cover.classList.remove('beating');
  $('flap').style.transform = 'rotateX(0deg)';
  $('resWrap').hidden = true;
  $('cardBottom').style.background = rank === 'first' ? '#FDEBB0' : '#FBF3DC';

  card.classList.add('noanim');
  layout(true);
  void card.offsetWidth;                       // 시작 위치를 굳힌 뒤 전환 재개
  card.classList.remove('noanim');
  card.classList.add('shake');

  after(450 * k, () => {                       // fly: 칸에서 화면 중앙으로
    active.phase = 'fly';
    card.classList.remove('shake');
    layout(false);
  });
  if (rank !== 'first') {
    after(1000 * k, () => {                    // beat: 당첨이면 하트가 분홍으로 물들며 두근거린다 (꽝은 ♥ 그대로)
      active.phase = 'beat';
      if (rank !== 'fifth') cover.textContent = '💓';
      cover.classList.add('beating');
    });
    after(1800 * k, openCard);                 // open: 접힌 종이가 위로 펼쳐진다
    after(2600 * k, () => {                    // reveal: 파티클
      active.phase = 'reveal';
      spawnParticles(rank);
    });
  } else {
    /* 1등 소원권 전용: 금빛 고동에서 시작해 섬광과 함께 펼쳐진다 */
    after(1000 * k, () => {                    // beat: 금빛으로 물들며 두근거린다
      active.phase = 'beat';
      cover.textContent = '💛';
      cover.classList.add('beating');
      card.classList.add('gold');
      $('ovbg').classList.add('deep');
      spawnSuck();
    });
    after(1750 * k, spawnSuck);                // 반짝이가 계속 빨려 들어온다
    after(2350 * k, () => {                    // charge: 떨림이 커지고 고동이 빨라진다
      active.phase = 'charge';
      cover.classList.add('fast');
      card.classList.add('charge');
      spawnSuck();
    });
    after(3100 * k, () => {                    // flash: 섬광이 터지고 금빛 광선이 돈다
      active.phase = 'flash';
      card.classList.remove('charge');
      card.classList.add('bam');
      $('rays').classList.add('on');
      const f = $('flash');
      f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
      $('particles').innerHTML = '';
      if (navigator.vibrate) navigator.vibrate([40, 50, 90]);
    });
    after(3300 * k, openCard);                 // open: 섬광이 걷히며 소원권이 나타난다
    after(4200 * k, () => {                    // reveal: 파티클과 컨페티 두 물결
      active.phase = 'reveal';
      spawnParticles('first');
      spawnConfetti(90, true);
      after(900 * k, () => spawnConfetti(40, true));
    });
  }
}

function openCard() {                          // 접힌 종이가 위로 펼쳐지고 결과가 보인다
  if (!active) return;
  active.phase = 'open';
  $('coverIcon').classList.remove('beating', 'fast');
  $('flap').style.transform = 'rotateX(180deg)';
  $('cardBottom').style.borderRadius = '0 0 14px 14px';
  $('cardBottom').style.top = '-2px';   // 접힌 선 틈 메우기: 아래장을 위로 살짝 겹친다
  const R = RANKS[active.rank];
  $('resText').textContent = R.label;
  if (active.rank === 'first') {               // 1등은 금빛 글자와 소원권 쿠폰으로
    $('resText').style.color = '';
    $('resText').classList.add('gold-shine');
    $('wtSub').textContent = R.prize;
    $('wishTicket').hidden = false;
    $('resReward').hidden = true;
  } else {
    $('resText').style.color = R.color;
    $('resReward').textContent = R.prize;
    $('resReward').style.color = R.color;
    $('resReward').hidden = false;
    $('wishTicket').hidden = true;
  }
  $('resWrap').hidden = false;
}

function confirmReveal() {
  if (!active || active.phase !== 'reveal') return;
  active.phase = 'closing';
  $('card').style.opacity = 0;
  $('ovbg').style.opacity = 0;
  $('rays').classList.remove('on');
  after(350, () => {
    paintCell(active.id);
    $('reveal').hidden = true;
    $('particles').innerHTML = '';
    $('confetti').innerHTML = '';
    $('card').classList.remove('gold', 'charge', 'bam');
    $('ovbg').classList.remove('deep');
    $('flash').classList.remove('pop');
    $('resText').classList.remove('gold-shine');
    $('wishTicket').hidden = true;
    $('resReward').hidden = false;
    active = null;
    timers.forEach(clearTimeout); timers = [];
    if (revealed.length === 60) $('done').hidden = false;
  });
}
$('ovbg').addEventListener('click', confirmReveal);
$('card').addEventListener('click', confirmReveal);

function spawnParticles(rank) {
  const icons = PARTICLE_ICONS[rank];
  if (!icons) return;
  const n = PARTICLE_COUNT[rank] || 10;
  for (let i = 0; i < n; i++) {
    const arm = document.createElement('span');
    arm.className = 'arm';
    arm.style.transform = 'rotate(' + Math.round(i * (360 / n) + Math.random() * 14) + 'deg)';
    const s = document.createElement('span');
    s.textContent = icons[i % icons.length];
    s.style.fontSize = (12 + Math.random() * 10).toFixed(0) + 'px';
    s.style.animationDuration = (0.8 + Math.random() * 0.5).toFixed(2) + 's';
    s.style.animationDelay = (Math.random() * 0.25).toFixed(2) + 's';
    arm.appendChild(s);
    $('particles').appendChild(arm);
  }
}
function spawnSuck() {                         // 1등 차지: 반짝이가 상자로 빨려 들어온다
  for (let i = 0; i < 8; i++) {
    const arm = document.createElement('span');
    arm.className = 'arm';
    arm.style.transform = 'rotate(' + Math.round(Math.random() * 360) + 'deg)';
    const s = document.createElement('span');
    s.textContent = ['✨', '⭐', '💛'][i % 3];
    s.style.fontSize = (10 + Math.random() * 8).toFixed(0) + 'px';
    s.style.animation = 'suckIn ' + (0.55 + Math.random() * 0.35).toFixed(2) + 's ease-in '
      + (Math.random() * 0.2).toFixed(2) + 's both';
    arm.appendChild(s);
    $('particles').appendChild(arm);
  }
}
function spawnConfetti(n, fancy) {
  for (let i = 0, total = n || 56; i < total; i++) {
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    p.style.left = (Math.random() * 100).toFixed(1) + '%';
    p.style.width = (6 + Math.random() * 5).toFixed(0) + 'px';
    p.style.height = (9 + Math.random() * 7).toFixed(0) + 'px';
    p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    p.style.animationDuration = (2.4 + Math.random() * 1.8).toFixed(2) + 's';
    p.style.animationDelay = (Math.random() * 0.8).toFixed(2) + 's';
    $('confetti').appendChild(p);
  }
  if (!fancy) return;
  const icons = ['🎫', '⭐', '💛', '✨'];       // 1등에는 이모지 조각도 함께 떨어진다
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    p.textContent = icons[i % icons.length];
    p.style.left = (Math.random() * 100).toFixed(1) + '%';
    p.style.fontSize = (14 + Math.random() * 12).toFixed(0) + 'px';
    p.style.animationDuration = (3 + Math.random() * 2).toFixed(2) + 's';
    p.style.animationDelay = (Math.random() * 1).toFixed(2) + 's';
    $('confetti').appendChild(p);
  }
}

/* ---------- CompletionModal ---------- */
Object.entries(RANKS).forEach(([rank, r], i) => {
  const d = document.createElement('div');
  if (rank === 'first') d.className = 'full';
  d.style.background = r.chipBg;
  d.style.color = r.chipColor;
  d.innerHTML = r.label + ' ' + (rank === 'first' ? r.short + ' ' : '')
    + '<span class="bhs n">' + r.count + '</span>개';
  $('dGrid').appendChild(d);
});
$('doneBtn').addEventListener('click', () => { $('done').hidden = true; });
if (revealed.length === 60) $('done').hidden = false;

/* ---------- QR 진입: ?c=토큰으로 들어오면 해당 칸이 열린다 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
function highlight(id) {
  const b = cells[id - 1];
  b.scrollIntoView({ block: 'center', behavior: 'smooth' });
  b.classList.remove('flash');
  void b.offsetWidth;
  b.classList.add('flash');
}
(function handleEntry() {
  const tok = new URLSearchParams(location.search).get('c');
  if (!tok) return;
  const entry = TOKENS[tok];
  if (!entry) {
    history.replaceState(null, '', location.pathname);
    toast('올바른 QR이 아니에요 🤔');
    return;
  }
  if (usedTokens[tok]) {                     // 이미 쓴 QR: 그때 연 칸을 보여준다
    history.replaceState(null, '', location.pathname);
    const cell = usedTokens[tok];
    usedEntry = cell;
    const R = RANKS[openedRank(cell)];
    highlight(cell);
    toast('이미 뽑은 티켓이에요 — ' + R.label + ' ' + R.short);
    return;
  }
  /* 결과는 정해졌지만 뽑기는 직접: 칸을 고를 때까지 URL을 유지해 새로고침에도 살아남는다 */
  pending = { token: tok, rank: entry[1] };
  setTimeout(() => toast('마음에 드는 칸을 하나 골라 뜯어봐! 💝'), 600);
})();

/* ---------- 처음부터 다시 (테스트용): 타이틀을 2.5초 안에 7번 탭 ---------- */
let taps = [];
$('title').addEventListener('click', () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 2500);
  taps.push(now);
  if (taps.length >= 7) {
    taps = [];
    if (confirm('뽑기판을 처음부터 다시 시작할까요?')) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    }
  }
});
</script>
</body>
</html>
