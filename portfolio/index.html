<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최아영 | 포트폴리오</title>
<meta name="description" content="백엔드 개발자 최아영의 포트폴리오. 운영 환경의 문제를 원인부터 추적하고 해결한 사례 다섯 건을 정리했습니다.">
<meta property="og:title" content="최아영 | 백엔드 포트폴리오">
<meta property="og:description" content="운영 환경의 문제를 원인부터 추적하고 해결하는 백엔드 개발자">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<script>try{var t=localStorage.getItem('theme');if(t){document.documentElement.dataset.theme=t;}}catch(e){}</script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --bg-2: #f4f5f6;
    --line: #e8eaed;
    --line-2: #d7dbe0;
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #8a94a1;
    --accent: #34766a;
    --accent-2: #275c52;
    --accent-soft: #e6f1ee;
    --blue-bg: #e0f2fe;  --blue-tx: #0369a1;  --blue-line: #bae6fd;
    --green-bg: #dcfce7; --green-tx: #15803d; --green-line: #bbf7d0;
    --red-bg: #fee2e2;   --red-tx: #b91c1c;   --red-line: #fecaca;
    --amber-bg: #fef3c7;
    --topbar: rgba(255,255,255,.86);

    --sans: "Pretendard Variable", Pretendard, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --wrap: 1120px;
  }

  :root[data-theme="dark"] {
    --bg: #0d1117;
    --bg-2: #161c24;
    --line: #222b36;
    --line-2: #36414e;
    --ink: #e6edf3;
    --ink-2: #a4b1bf;
    --ink-3: #6e7b89;
    --accent: #7cc4b0;
    --accent-2: #a3d8c9;
    --accent-soft: #14312a;
    --blue-bg: #0c3350;  --blue-tx: #7dd3fc; --blue-line: #174c73;
    --green-bg: #0f3b2b; --green-tx: #6ee7b7; --green-line: #1d5a43;
    --red-bg: #45191c;   --red-tx: #fca5a5;  --red-line: #6b282c;
    --amber-bg: #3a2f10;
    --topbar: rgba(13,17,23,.85);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;
      --bg-2: #161c24;
      --line: #222b36;
      --line-2: #36414e;
      --ink: #e6edf3;
      --ink-2: #a4b1bf;
      --ink-3: #6e7b89;
      --accent: #7cc4b0;
      --accent-2: #a3d8c9;
      --accent-soft: #14312a;
      --blue-bg: #0c3350;  --blue-tx: #7dd3fc; --blue-line: #174c73;
      --green-bg: #0f3b2b; --green-tx: #6ee7b7; --green-line: #1d5a43;
      --red-bg: #45191c;   --red-tx: #fca5a5;  --red-line: #6b282c;
      --amber-bg: #3a2f10;
      --topbar: rgba(13,17,23,.85);
    }
  }

  html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.75;
    letter-spacing: -0.012em; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  b, strong { font-weight: 700; color: var(--ink); }
  em { font-style: normal; background: var(--amber-bg); padding: 1px 4px; border-radius: 4px; }
  code {
    font-family: var(--mono); font-size: .86em; letter-spacing: 0;
    background: var(--bg-2); color: var(--accent-2);
    padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere;
  }
  img { max-width: 100%; display: block; }

  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 28px; }
  table.sheet { width: 100%; min-width: 0; border-collapse: collapse; table-layout: fixed; }
  table.sheet > thead > tr > td,
  table.sheet > tbody > tr > td,
  table.sheet > tfoot > tr > td { padding: 0; border: 0; }
  .vpad { height: 0; }

  .rv { opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rv { opacity: 1; transform: none; transition: none; }
  }

  /* ===== Topbar ===== */
  .topbar {
    position: sticky; top: 0; z-index: 60;
    background: var(--topbar); backdrop-filter: saturate(180%) blur(10px); -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in { max-width: var(--wrap); margin: 0 auto; padding: 0 28px; height: 56px; display: flex; align-items: center; gap: 18px; position: relative; }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; }
  .brand span { font-weight: 500; color: var(--ink-3); margin-left: 8px; font-size: 12.5px; }
  .topnav { display: flex; gap: 20px; margin-left: auto; }
  .topnav a { font-size: 13.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; white-space: nowrap; padding: 4px 0; }
  .topnav a:hover { color: var(--ink); }
  .topnav a.on { color: var(--accent); font-weight: 700; }
  .tools { display: flex; gap: 4px; }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; min-width: 32px; padding: 0 8px;
    background: none; border: 0; color: var(--ink-3); border-radius: 8px;
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .iconbtn:hover { color: var(--ink); background: var(--bg-2); }
  .iconbtn svg { width: 15px; height: 15px; }
  #menu { display: none; }

  /* ===== Section (2단) ===== */
  section.sec { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0 60px; padding: 76px 0 0; }
  .sec-l { align-self: start; position: sticky; top: 84px; }
  .sec-l .no {
    display: inline-flex; font-family: var(--mono); font-size: 12px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 12px;
  }
  .sec-l h2 { font-size: 23px; font-weight: 800; letter-spacing: -0.03em; margin-top: 12px; word-break: keep-all; }
  .sec-r { min-width: 0; }
  .sec-note { color: var(--ink-2); font-size: 15px; margin-bottom: 28px; max-width: 62ch; word-break: keep-all; }
  .sec-foot { margin-top: 26px; font-size: 14px; }
  .more { color: var(--accent); text-decoration: none; font-weight: 600; }
  .more:hover { text-decoration: underline; }

  .lbl {
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent); margin: 44px 0 12px;
  }
  .lbl:first-child { margin-top: 0; }

  /* ===== Intro ===== */
  .eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
  .sec-r h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.038em; line-height: 1.28; margin-top: 12px; max-width: 24ch; word-break: keep-all; }
  .idchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .idc {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-2);
    background: var(--bg-2); border-radius: 999px; padding: 6px 15px; text-decoration: none; white-space: nowrap;
  }
  .idc.name { background: var(--accent-soft); color: var(--accent-2); font-weight: 700; }
  a.idc:hover { background: var(--accent); color: #fff; }
  a.idc svg { width: 14px; height: 14px; }
  .lead { margin-top: 24px; font-size: 16px; color: var(--ink-2); max-width: 62ch; word-break: keep-all; }

  .nums { display: flex; flex-wrap: wrap; gap: 14px 0; margin-top: 30px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .num { padding-right: 26px; margin-right: 26px; border-right: 1px solid var(--line); min-width: 0; }
  .num:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
  .num .v { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; white-space: nowrap; }
  .num .v small { font-size: 14px; font-weight: 700; margin: 0 1px; }
  .num .l { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-top: 3px; }
  .num .e { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; word-break: keep-all; }

  .about p { color: var(--ink-2); max-width: 66ch; word-break: keep-all; }
  .about p + p { margin-top: 10px; }

  .skills .sg { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .skills .sg:first-child { padding-top: 0; }
  .skills .sg:last-child { border-bottom: 0; }
  .skills dt { font-size: 13.5px; font-weight: 700; margin-bottom: 10px; }
  .skills .use { font-size: 13px; color: var(--ink-3); margin-top: 10px; word-break: keep-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--bg-2); border-radius: 999px; padding: 4px 13px; white-space: nowrap; }

  /* ===== Career / Project ===== */
  .per { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
  .co-nm { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin-top: 6px; }
  .co-rl { font-size: 13.5px; color: var(--ink-3); margin-top: 4px; }
  .co-sum { margin-top: 14px; color: var(--ink-2); font-size: 15px; max-width: 66ch; word-break: keep-all; }

  .proj { border-top: 1px solid var(--line); margin-top: 32px; padding-top: 30px; }
  .proj .pt { font-size: 19px; font-weight: 800; letter-spacing: -0.025em; margin-top: 6px; }
  .proj .pt .sv { font-size: 13.5px; font-weight: 500; color: var(--ink-3); margin-left: 7px; }
  .proj .desc { color: var(--ink-2); font-size: 15px; margin-top: 8px; word-break: keep-all; max-width: 66ch; }
  .proj-meta { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px 22px; margin-top: 20px; font-size: 14.5px; align-items: baseline; }
  .proj-meta dt {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent);
  }
  .proj-meta dd { color: var(--ink-2); min-width: 0; word-break: keep-all; }
  .hl { list-style: none; }
  .hl li { position: relative; padding-left: 16px; margin: 7px 0; word-break: keep-all; }
  .hl li:first-child { margin-top: 0; }
  .hl li::before { content: "–"; position: absolute; left: 0; top: 0; color: var(--ink-3); }
  .scale { display: flex; flex-wrap: wrap; gap: 6px; }
  .scale .s { font-size: 12.5px; color: var(--ink-2); background: var(--bg-2); border-radius: 999px; padding: 4px 13px; }
  .scale .s b { font-family: var(--mono); font-size: 12px; margin-right: 6px; }
  .clink {
    font-size: 12.5px; font-weight: 600; text-decoration: none;
    color: var(--accent-2); background: var(--accent-soft); border-radius: 999px; padding: 5px 14px; white-space: nowrap;
  }
  .clink:hover { background: var(--accent); color: #fff; }
  .proj-links { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .proj-links .lb { display: none; }

  /* ===== Problem pairs ===== */
  .pq { list-style: none; }
  .pq li { padding: 12px 0; border-top: 1px solid var(--line); }
  .pq li:first-child { border-top: 0; padding-top: 0; }
  .pq .q, .pq .a { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; font-size: 14.5px; color: var(--ink-2); word-break: keep-all; }
  .pq .a { margin-top: 6px; }
  .pq .q > span, .pq .a > span { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); padding-top: 4px; }
  .pq .a > span { color: var(--accent); }
  .pq .a { color: var(--ink); }
  .pq .q > div, .pq .a > div { min-width: 0; }

  /* ===== Cases (접이식) ===== */
  .cdl { border-top: 1px solid var(--line); }
  details.cd { border-bottom: 1px solid var(--line); scroll-margin-top: 76px; }
  details.cd > summary {
    list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr) 22px; gap: 14px;
    padding: 16px 0; align-items: start;
  }
  details.cd > summary::-webkit-details-marker { display: none; }
  details.cd > summary:hover .ct { color: var(--accent-2); }
  details.cd .n { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--accent); padding-top: 3px; }
  details.cd .tx { min-width: 0; }
  details.cd .ct { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; word-break: keep-all; }
  details.cd .sb { display: block; font-size: 13.5px; color: var(--ink-3); margin-top: 3px; word-break: keep-all; }
  details.cd .chev { color: var(--ink-3); padding-top: 4px; transition: transform .2s ease; }
  details.cd .chev svg { width: 17px; height: 17px; }
  details.cd[open] .chev { transform: rotate(180deg); }
  details.cd[open] > summary { padding-bottom: 4px; }
  details.cd .case { padding: 8px 0 30px 48px; }

  .case .per { margin-top: 2px; }
  .case h3 { margin-top: 6px; font-size: 20px; font-weight: 800; letter-spacing: -0.028em; line-height: 1.45; word-break: keep-all; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .facts > div { padding: 11px 16px 11px 0; min-width: 0; }
  .facts > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
  .facts dt { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--ink-3); }
  .facts dd { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.55; word-break: keep-all; }
  .steps { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-top: 16px; align-items: baseline; }
  .steps span { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .steps span.key { color: var(--accent); }
  .steps i { color: var(--line-2); font-style: normal; font-size: 11px; }

  .cs { margin-top: 30px; }
  .cs h4 {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 8px;
  }
  .cs h4 .sn { font-size: 10.5px; }
  .cs.key h4 { color: var(--accent); }
  .cs h4::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .cs h5 { font-size: 17px; font-weight: 800; letter-spacing: -0.024em; line-height: 1.45; margin: 0 0 6px; word-break: keep-all; }
  .cs.key { padding-left: 15px; border-left: 2px solid var(--accent-soft); }
  :root[data-theme="dark"] .cs.key { border-left-color: var(--accent-soft); }
  .case-body p { margin: 9px 0; color: var(--ink-2); word-break: keep-all; }
  .case-body ul { list-style: none; margin: 9px 0; }
  .case-body ul li { position: relative; padding-left: 16px; margin: 6px 0; color: var(--ink-2); word-break: keep-all; }
  .case-body ul li::before { content: "–"; position: absolute; left: 0; top: 0; color: var(--ink-3); }

  .note { display: flex; gap: 12px; align-items: flex-start; border-radius: 8px; padding: 13px 16px; margin: 14px 0; font-size: 14.5px; line-height: 1.7; }
  .note .ic { flex: 0 0 auto; font-size: 15px; line-height: 1.6; }
  .note .bd { min-width: 0; word-break: keep-all; }
  .note .bd ul { margin: 0; }
  .note.warn { background: var(--red-bg); }
  .note.warn .bd, .note.warn .bd li, .note.warn b { color: var(--red-tx); }
  .note.warn .bd li::before { color: var(--red-tx); opacity: .6; }
  .note.ok { background: var(--green-bg); }
  .note.ok .bd, .note.ok .bd li, .note.ok b { color: var(--green-tx); }
  .note.ok .bd li::before { color: var(--green-tx); opacity: .6; }
  .note.info { background: var(--blue-bg); }
  .note.info .bd, .note.info .bd li, .note.info b { color: var(--blue-tx); }
  .note code { background: rgba(255,255,255,.5); color: inherit; }
  :root[data-theme="dark"] .note code { background: rgba(0,0,0,.25); }

  figure.fig { background: var(--bg-2); border-radius: 8px; padding: 16px 14px; margin-top: 16px; overflow-x: auto; }
  figure.fig svg { display: block; width: 100%; height: auto; min-width: 420px; }
  figure.fig figcaption { font-size: 12px; color: var(--ink-3); margin-top: 10px; text-align: center; }
  .fig text { font-family: var(--sans); letter-spacing: -0.01em; }
  .fig text.mn { font-family: var(--mono); letter-spacing: 0; }
  .sv-box     { fill: var(--bg); stroke: var(--line-2); }
  .sv-panel   { fill: var(--bg); stroke: var(--line); }
  .sv-chip    { fill: var(--bg-2);    stroke: var(--line-2); }
  .sv-blue    { fill: var(--blue-bg); stroke: var(--blue-line); }
  .sv-green   { fill: var(--green-bg); stroke: var(--green-line); }
  .sv-red     { fill: var(--red-bg);  stroke: var(--red-line); }
  .sv-green-f { fill: var(--green-bg); }
  .sv-red-f   { fill: var(--red-bg); }
  .sv-t  { fill: var(--ink); }
  .sv-t2 { fill: var(--ink-2); }
  .sv-t3 { fill: var(--ink-3); }
  .sv-bt { fill: var(--blue-tx); }
  .sv-gt { fill: var(--green-tx); }
  .sv-rt { fill: var(--red-tx); }
  .sv-arrow { stroke: var(--ink-3); }
  .sv-head  { fill: var(--ink-3); }

  /* ===== History ===== */
  .hgroup + .hgroup { margin-top: 36px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .hgroup .row:last-child { border-bottom: 0; }
  .row .m { font-size: 15px; font-weight: 700; }
  .row .s { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .row .d { font-family: var(--mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }

  /* ===== Footer ===== */
  footer.foot { margin-top: 96px; padding: 30px 0 72px; border-top: 1px solid var(--line); }
  .foot-in { max-width: var(--wrap); margin: 0 auto; padding: 0 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
  .foot-in a { color: var(--ink-2); text-decoration: none; }
  .foot-in a:hover { color: var(--accent); text-decoration: underline; }
  .foot-links { display: flex; gap: 16px; flex-wrap: wrap; }

  .nojs { margin: 40px 0; padding: 18px 20px; background: var(--amber-bg); border-radius: 8px; color: var(--ink); }
  .nojs a { color: var(--accent); }

  /* ===== Responsive ===== */
  @media (max-width: 940px) {
    section.sec { grid-template-columns: 1fr; gap: 0; padding-top: 60px; }
    .sec-l { position: static; display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .sec-l h2 { margin-top: 0; font-size: 20px; }
  }
  @media (max-width: 860px) {
    .topnav { display: none; }
    .topnav.open {
      display: flex; flex-direction: column; gap: 2px;
      position: absolute; left: 0; right: 0; top: 56px;
      background: var(--bg); border-bottom: 1px solid var(--line);
      padding: 10px 18px 14px;
    }
    .topnav.open a { padding: 10px 4px; font-size: 15px; }
    #menu { display: inline-flex; }
    .brand span { display: none; }
    .tools { margin-left: auto; }
    .wrap, .topbar-in, .foot-in { padding: 0 20px; }
    .sec-r h1 { font-size: 30px; max-width: none; }
    .lead { font-size: 15px; }
    .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 0; }
    .num { padding-right: 16px; margin-right: 16px; }
    .num:nth-child(2n) { border-right: 0; margin-right: 0; padding-right: 0; }

    "가장 많이 작업한 영역은 주문을 집행하는 executor의 로직과 단위 테스트이고, 멀티유저 API의 라우터와 서비스 계층, 분석을 담당하는 trading-worker의 도메인 로직과 오케스트레이션에 걸쳐 작업했습니다.",
    "테스트 파일 235개 가운데 177개에 커밋했습니다. 도메인 로직과 오케스트레이션은 단위 테스트를 함께 붙여 나갔습니다.",
    "Terraform으로 GCP의 Cloud Run과 GCE, Cloud SQL, Pub/Sub, Scheduler, Secret Manager와 Cloudflare 리소스를 코드로 관리하는 인프라 구성에 참여했습니다.",
    "에이전트 워크플로와 코딩 규칙을 저장소 안에 문서로 두고 개발 도구 설정을 공유해 여덟 명이 같은 기준으로 작업합니다."
   ],
   "problems": [],
   "stack": ["Python", "FastAPI", "SQLAlchemy", "PostgreSQL", "ccxt", "Pub/Sub", "Terraform", "GCP", "Docker", "Next.js", "React"],
   "cases": [],
   "links": []
  }
 ],
 "education": [
  { "m": "우석대학교", "s": "정보보안 전공", "d": "2018.03 – 2022.02" },
  { "m": "멋쟁이사자처럼", "s": "백엔드 스쿨 수료 (Java, Spring Boot)", "d": "2022.09 – 2023.02" }
 ],
 "certs": [
  { "m": "정보보안기사", "s": "한국방송통신전파진흥원", "d": "2026.08" },
  { "m": "SQL 개발자 (SQLD)", "s": "한국데이터산업진흥원", "d": "2022.12" },
  { "m": "컴퓨터활용능력 1급", "s": "대한상공회의소", "d": "2022.01" },
  { "m": "정보처리기사", "s": "한국산업인력공단", "d": "2021.06" }
 ]
};

/* ===================== 렌더링 ===================== */
const chips = arr => `<div class="chips">${arr.map(t => `<span class="chip">${t}</span>`).join('')}</div>`;
const ICON_GH = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>';
const ICON_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';

function section(id, no, title, en, note, inner, foot) {
  return `<section class="sec" id="${id}">
    <div class="sec-l"><span class="no rv">${no}</span><h2 class="rv">${title}</h2></div>
    <div class="sec-r">
      ${note ? `<p class="sec-note rv">${note}</p>` : ''}
      ${inner}
      ${foot ? `<div class="sec-foot">${foot}</div>` : ''}
    </div>
  </section>`;
}

function renderIntro(d) {
  const p = d.profile;
  return section('about', '01', '소개 / 스킬', 'About', '',
    `<div class="eyebrow rv">Backend Developer</div>
     <h1 class="rv">${p.headline}</h1>
     <div class="idchips rv">
       <span class="idc name">${p.name}</span>
       <span class="idc">백엔드 경력 ${p.years}</span>
       <a class="idc" href="https://${p.github}" target="_blank" rel="noopener">${ICON_GH}GitHub</a>
       <a class="idc" href="${p.links.resume}">이력서</a>
       <a class="idc" href="${p.links.experience}">경력기술서</a>
       <a class="idc" href="mailto:${p.email}">${ICON_MAIL}Contact</a>
     </div>
     <p class="lead rv">${p.lead}</p>
     <div class="nums rv">
       ${p.stats.map(n => `<div class="num"><div class="v">${n.v}</div><div class="l">${n.l}</div><div class="e">${n.e}</div></div>`).join('')}
     </div>
     <div class="lbl rv">About</div>
     <div class="about rv">${d.about.map(t => `<p>${t}</p>`).join('')}</div>
     <div class="lbl rv">Skills</div>
     <dl class="skills rv">
       ${d.skills.map(g => `<div class="sg"><dt>${g.g}</dt><dd>${chips(g.items)}<p class="use">${g.use}</p></dd></div>`).join('')}
     </dl>`);
}

function problemPairs(pj) {
  if (!pj.problems || !pj.problems.length) return '';
  return `<dt>Problems</dt><dd><ul class="pq">${pj.problems.map(x =>
    `<li><div class="q"><span>문제</span><div>${x.p}</div></div><div class="a"><span>해결</span><div>${x.s}</div></div></li>`).join('')}</ul></dd>`;
}

function caseDetail(c, d) {
  const rail = c.sections.map((sc, i) => `${i ? '<i>→</i>' : ''}<span class="${sc.key ? 'key' : ''}">${sc.label}</span>`).join('');
  const body = c.sections.map((sc, i) => `
      <section class="cs ${sc.key ? 'key' : ''}">
        <h4><span class="sn">0${i + 1}</span>${sc.label}</h4>
        ${sc.head ? `<h5>${sc.head}</h5>` : ''}
        ${renderBlocks(sc.blocks, d.figures)}
      </section>`).join('');
  return `
    <details class="cd" id="${c.id}">
      <summary>
        <span class="n">${c.no}</span>
        <span class="tx"><span class="ct">${c.cardTitle}</span><span class="sb">${c.cardSub}</span></span>
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      </summary>
      <article class="case">
        <div class="per">${c.project}</div>
        <h3>${c.title}</h3>
        <dl class="facts">${c.facts.map(f => `<div><dt>${f.k}</dt><dd>${f.v}</dd></div>`).join('')}</dl>
        <div class="steps">${rail}</div>
        <div class="case-body">${body}</div>
      </article>
    </details>`;
}

function renderCases(d) {
  const cs = d.cases.filter(c => !c.draft);
  return section('cases', '03', '문제 해결', 'Problem Solving', d.casesNote + ' 제목을 누르면 펼쳐집니다.',
    `<div class="cdl rv">${cs.map(c => caseDetail(c, d)).join('')}</div>`);
}

function projectCard(pj, d) {
  const links = pj.links.map(l => `<a class="clink" href="${l.href}" target="_blank" rel="noopener">${l.label} ↗</a>`);
  return `
    <article class="proj rv">
      <div class="per">${pj.period}</div>
      <h3 class="pt">${pj.name}${pj.sub ? `<span class="sv">${pj.sub}</span>` : ''}</h3>
      <p class="desc">${pj.desc}</p>
      <dl class="proj-meta">
        <dt>Role</dt><dd>${pj.role}</dd>
        ${pj.scale.length ? `<dt>Scale</dt><dd><div class="scale">${pj.scale.map(s => `<span class="s"><b>${s.v}</b>${s.l}</span>`).join('')}</div></dd>` : ''}
        <dt>Stack</dt><dd>${chips(pj.stack)}</dd>
        ${pj.highlights.length ? `<dt>Work</dt><dd><ul class="hl">${pj.highlights.map(h => `<li>${h}</li>`).join('')}</ul></dd>` : ''}
        ${problemPairs(pj)}
      </dl>
      ${links.length ? `<dl class="proj-meta" style="margin-top:14px"><dt>Links</dt><dd><div class="proj-links">${links.join('')}</div></dd></dl>` : ''}
    </article>`;
}

function renderCareer(d) {
  const c = d.company;
  return section('career', '02', '경력', 'Career', '',
    `<div class="co rv">
       <div class="per">${c.period} · ${c.years}</div>
       <h3 class="co-nm">${c.name}</h3>
       <div class="co-rl">${c.role}</div>
     </div>
     <p class="co-sum rv">${c.summary}</p>
     ${d.projects.map(pj => projectCard(pj, d)).join('')}`,
    `<a class="more" href="${d.profile.links.experience}">경력기술서에서 전체 항목 보기 →</a>`);
}

function renderBlocks(blocks, figures) {
  return blocks.map(b => {
    if (b.t === 'p')  return `<p>${b.v}</p>`;
    if (b.t === 'ul') return `<ul>${b.v.map(x => `<li>${x}</li>`).join('')}</ul>`;
    if (b.t === 'note') return `<div class="note ${b.tone}"><span class="ic">${b.tone === 'warn' ? '⚠️' : 'ℹ️'}</span><div class="bd">${b.v}</div></div>`;
    if (b.t === 'res')  return `<div class="note ${b.tone}"><span class="ic">${b.tone === 'ok' ? '✅' : '⚠️'}</span><div class="bd"><ul>${b.v.map(x => `<li>${x}</li>`).join('')}</ul></div></div>`;
    if (b.t === 'fig')  return `<figure class="fig">${figures[b.i]}<figcaption>${b.cap}</figcaption></figure>`;
    return '';
  }).join('');
}

function renderPersonal(d) {
  return section('personal', '04', '개인 프로젝트', 'Side Projects', d.personalNote,
    d.personal.map(pj => projectCard(pj, d)).join(''));
}

function renderHistory(d) {
  const rows = arr => arr.map(r =>
    `<div class="row"><div><div class="m">${r.m}</div><div class="s">${r.s}</div></div><div class="d">${r.d}</div></div>`).join('');
  return section('history', '05', '학력과 자격증', 'Education', '',
    `<div class="hgroup rv"><div class="lbl">Education</div>${rows(d.education)}</div>
     <div class="hgroup rv"><div class="lbl">Certificates</div>${rows(d.certs)}</div>`);
}

function renderFooter(p) {
  return `<footer class="foot"><div class="foot-in">
    <div>최아영 · 백엔드 개발자</div>
    <div class="foot-links">
      <a href="mailto:${p.email}">${p.email}</a>
      <a href="https://${p.github}" target="_blank" rel="noopener">${p.github}</a>
      <a href="${p.links.resume}">이력서</a>
      <a href="${p.links.experience}">경력기술서</a>
    </div>
  </div></footer>`;
}

/* ===================== 부팅 ===================== */
(function () {
  const app = document.getElementById('app');
  app.innerHTML =
    renderIntro(DATA) +
    renderCareer(DATA) +
    renderCases(DATA) +
    renderPersonal(DATA) +
    renderHistory(DATA);
  document.querySelector('table.sheet').insertAdjacentHTML('afterend', renderFooter(DATA.profile));

  /* 테마 */
  const root = document.documentElement;
  const btn = document.getElementById('theme');
  const sysDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : sysDark();
  const paint = () => { btn.textContent = isDark() ? '☀' : '☾'; };
  btn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    paint();
  });
  paint();

  /* 접힌 문제 해결 상세: 링크로 들어오면 펼치고, 인쇄 때는 전부 펼친다 */
  const cds = () => Array.prototype.slice.call(document.querySelectorAll('details.cd'));
  const openHash = () => {
    if (!location.hash) return;
    const el = document.getElementById(location.hash.slice(1));
    if (el && el.tagName === 'DETAILS') el.open = true;
  };
  openHash();
  window.addEventListener('hashchange', openHash);
  let wasOpen = [];
  window.addEventListener('beforeprint', () => { wasOpen = cds().map(d => d.open); cds().forEach(d => { d.open = true; }); });
  window.addEventListener('afterprint', () => { cds().forEach((d, i) => { d.open = wasOpen[i]; }); });
  document.getElementById('pdf').addEventListener('click', () => window.print());

  /* 모바일 메뉴 */
  const nav = document.getElementById('topnav');
  const menu = document.getElementById('menu');
  const closeNav = () => { nav.classList.remove('open'); menu.setAttribute('aria-expanded', 'false'); };
  menu.addEventListener('click', () => {
    const open = nav.classList.toggle('open');
    menu.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.addEventListener('click', e => { if (e.target.tagName === 'A') closeNav(); });
  document.addEventListener('click', e => { if (!e.target.closest('.topbar')) closeNav(); });

  /* 스크롤 스파이 */
  const links = Array.prototype.slice.call(nav.querySelectorAll('a'));
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  let tick = false;
  const sync = () => {
    const y = window.scrollY + 140;
    let cur = -1;
    for (let i = 0; i < targets.length; i++) {
      if (targets[i] && targets[i].offsetTop <= y) cur = i;
    }
    links.forEach((a, i) => a.classList.toggle('on', i === cur));
  };
  window.addEventListener('scroll', () => {
    if (tick) return;
    tick = true;
    requestAnimationFrame(() => { sync(); tick = false; });
  }, { passive: true });
  sync();

  /* 등장 애니메이션 (인쇄와 감속 설정에서는 즉시 표시) */
  const rv = Array.prototype.slice.call(document.querySelectorAll('.rv'));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window)) {
    rv.forEach(el => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    rv.forEach(el => io.observe(el));
    window.addEventListener('beforeprint', () => rv.forEach(el => el.classList.add('in')));
  }
})();
</script>

</body>
</html>
